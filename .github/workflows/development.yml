name: Development build

on:
  pull_request:
    branches-ignore:
      - 'l10n_main'
    types: [opened, reopened]
  push:
    branches-ignore:
      - 'l10n_main'
  workflow_dispatch:

jobs:
  build:
    name: Development build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-26
    steps:
      - name: Remove work folders
        run: |
          echo before
          ls -lah ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          echo after
          ls -lah ./

      - name: Checkout repository
        uses: actions/checkout@main

      - name: Checkout repository submodules
        run: git submodule update --init --recursive

      # ---- route B: make sure the LWJGL 3.4.1 files are really there, then fix the spvc file name ----
      - name: LWJGL 3.4.1 natives and jars fix
        shell: bash {0}
        run: |
          F=Natives/resources/Frameworks
          echo "ref: $GITHUB_REF"
          git log --oneline -3
          echo "--- BEFORE: Frameworks"; ls -l "$F" | head -60
          echo "--- BEFORE: lwjgl33 / lwjgl34"; ls -l "$F/lwjgl33" "$F/lwjgl34" 2>&1 | head -40
          echo "--- BEFORE: JavaApp/libs"; ls -l JavaApp/libs

          # Restore the PR's LWJGL files from ryanmurf's branch (no-op if the merge already brought them)
          git fetch --depth 1 https://github.com/ryanmurf/Amethyst-iOS lwjgl-341 || echo "WARNING: fetch of lwjgl-341 failed"
          for p in "$F/lwjgl33" "$F/lwjgl34" "$F/libopenal.dylib" "$F/libshaderc.dylib" \
                   JavaApp/libs/lwjgl-3.3.3 JavaApp/libs/lwjgl-3.4.1; do
            git checkout FETCH_HEAD -- "$p" && echo "restored: $p" || echo "WARNING: could not restore $p"
          done

          # The PR moved the LWJGL natives into lwjgl33/ and lwjgl34/. Stale copies at the Frameworks root
          # would be found first on java.library.path and mix 3.3.3 natives into the 3.4.1 jars.
          if [ -d "$F/lwjgl34" ]; then
            for n in libfreetype liblwjgl liblwjgl_nanovg liblwjgl_opengl liblwjgl_stb liblwjgl_tinyfd liblwjgl_vma; do
              [ -f "$F/$n.dylib" ] && rm -f "$F/$n.dylib" && echo "removed stale root copy: $n.dylib"
            done
          fi

          # LWJGL asks for libspirv-cross.dylib, the PR ships libspirv-cross-c-shared.0.68.0.dylib
          S="$F/lwjgl34/libspirv-cross-c-shared.0.68.0.dylib"
          if [ -f "$S" ]; then
            cp "$S" "$F/lwjgl34/libspirv-cross.dylib" && echo "spvc: copied to libspirv-cross.dylib"
          else
            echo "WARNING: $S not found"
          fi
          echo "--- AFTER: lwjgl34"; ls -l "$F/lwjgl34" 2>&1
          file "$F/lwjgl34/libspirv-cross.dylib" 2>&1 | head -2
          vtool -show-build "$F/lwjgl34/libspirv-cross.dylib" 2>&1 | grep -E 'platform|minos' | tr '\n' ' '; echo

      - name: Setup JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Verify JDK
        run: |
          echo JAVA_HOME=$JAVA_HOME
          $JAVA_HOME/bin/java -version

      - name: Select Xcode 26 (newest installed)
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=/Applications/Xcode.app
          echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version) ($(xcrun --sdk iphoneos --show-sdk-build-version))"
          echo "iphonesimulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version) ($(xcrun --sdk iphonesimulator --show-sdk-build-version))"
          xcrun simctl list runtimes || true

      - name: Get gl4es latest commit hash
        id: gl4es-sha
        run: echo sha=$(git ls-remote https://github.com/PojavLauncherTeam/gl4es-114-extra refs/heads/master | grep -io '^\S*') >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache gl4es
        uses: actions/cache@main
        if: false
        id: gl4es-cache
        with:
          path: gl4es/libs
          key: gl4es-holy-ios-shared-2-${{ steps.gl4es-sha.outputs.sha }}

      - name: Get gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@main
        with:
          repository: 'PojavLauncherTeam/gl4es-114-extra'
          path: 'gl4es'

      - name: Build gl4es
        if: false && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          cd gl4es
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name "github-actions"
          export PATH=/opt/procursus/bin:$PATH
          wget https://github.com/leetal/ios-cmake/raw/master/ios.toolchain.cmake
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=ios.toolchain.cmake -DDEFAULT_ES=2 \
            -DNOX11=ON -DNOEGL=OFF -DSTATICLIB=OFF -DPLATFORM=OS64 \
            -DCMAKE_C_FLAGS=-Wno-error=implicit-function-declaration
          cmake --build build --config RelWithDebInfo --target GL
          cp -R lib/libGL.dylib ../Natives/resources/Frameworks/libgl4es_114.dylib

      - name: Push gl4es
        if: false && github.event != 'pull_request' && github.ref_name == 'main' && steps.gl4es-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          git add Natives/resources/Frameworks/libgl4es_114.dylib
          git commit -am "CI: Update gl4es"
          git push

      - name: Install gmake
        run: brew install make

      - name: Install ldid
        run: brew install ldid

      - name: Download iOS Simulator Platform (only if no runtime is installed)
        continue-on-error: true
        run: |
          if xcrun simctl list runtimes | grep -q 'iOS '; then
            echo "an iOS simulator runtime is already installed, skipping download"
          else
            sudo xcodebuild -downloadPlatform iOS
          fi

      - name: Build for iOS
        run: |
          export PATH=/opt/homebrew/bin:$PATH
          export SLIMMED=1
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 BOOTJDK=$JAVA_HOME/bin
          gmake -j$(sysctl -n hw.ncpu) dsym package PLATFORM=2 TROLLSTORE_JIT_ENT=1 BOOTJDK=$JAVA_HOME/bin

      - name: Upload regular ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-ios.ipa
          path: artifacts/org.angelauramc.amethyst-*-ios.ipa

      - name: Upload regular tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst-ios-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst-*-ios-trollstore.tipa

      - name: Upload slimmed ipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-ios.ipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-ios.ipa

      - name: Upload slimmed tipa
        uses: actions/upload-artifact@main
        with:
          name: org.angelauramc.amethyst.slimmed-ios-trollstore.tipa
          path: artifacts/org.angelauramc.amethyst.slimmed-*-ios-trollstore.tipa

      - name: Upload PojavLauncher.dSYM
        uses: actions/upload-artifact@main
        with:
          name: AngelAuraAmethyst.dSYM
          path: artifacts/AngelAuraAmethyst.dSYM
