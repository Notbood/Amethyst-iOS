name: Patch MobileGlues for iOS build (alias, gettid, linker flag)

# MobileGlues 2.x is written for Linux/Android; Apple's compiler rejects parts of it.
# This adds Natives/patch_mobileglues.py and makes the Makefile run it right before MobileGlues is compiled:
#   - __attribute__((alias)) -> small forwarding functions    - syscall(__NR_gettid) -> pthread_threadid_np
#   - -Wl,-Bsymbolic-functions (GNU ld only, Apple ld: 'unknown options') -> harmless -Wl,-w
# It also scans MobileGlues for OTHER Linux-only code and prints the list (log + run summary + artifact).
# Does not touch workflow files. Safe to run again (it updates the script). Run from the Actions tab.
# Afterwards run "Development build" on that branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to patch"
        required: true
        default: "lwjgl-b-mg2"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Add patch script and hook it into the Makefile
        shell: bash {0}
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          mkdir -p Natives
          cat > Natives/patch_mobileglues.py <<'PY1'
          #!/usr/bin/env python3
          """Make MobileGlues (written for Linux/Android) compile on Darwin. Idempotent, prints what it changed.
            1) __attribute__((alias("x"))) is unsupported on Darwin -> rewritten into forwarding functions
            2) syscall(__NR_gettid) does not exist on Darwin -> pthread_threadid_np helper
            3) -Wl,-Bsymbolic[-functions] is a GNU ld flag (Apple ld: 'unknown options') -> replaced by the harmless -Wl,-w
          Usage: patch_mobileglues.py <MobileGlues-cpp dir>"""
          import os, re, sys

          root = sys.argv[1]
          tid_re = re.compile(r"syscall\s*\(\s*(?:__NR_gettid|SYS_gettid)\s*\)")
          link_re = re.compile(r"(?:-Xlinker\s+|-Wl,)-Bsymbolic(?:-functions)?(?![\w-])")
          inc_re = re.compile(r"^[ \t]*#[ \t]*include[^\n]*$", re.M)
          TID_HELPER = """
          #ifdef __APPLE__
          #ifndef MG_DARWIN_TID_DEFINED
          #define MG_DARWIN_TID_DEFINED
          #include <pthread.h>
          #include <stdint.h>
          static inline long mg_darwin_tid() { uint64_t t = 0; pthread_threadid_np(NULL, &t); return (long)t; }
          #endif
          #endif
          """
          alias_re = re.compile(r'__attribute__\s*\(\(\s*alias\s*\(\s*"(\w+)"\s*\)\s*\)\)\s*;')
          SKIP = {"GLAPI", "GLAPIENTRY", "extern", "static", "inline", "APIENTRY"}

          def split_params(p):
              out, depth, cur = [], 0, ""
              for ch in p:
                  if ch in "([<":
                      depth += 1
                  elif ch in ")]>":
                      depth -= 1
                  if ch == "," and depth == 0:
                      out.append(cur); cur = ""
                  else:
                      cur += ch
              if cur.strip():
                  out.append(cur)
              return out

          def convert(decl, target):
              decl = " ".join(decl.split())
              i = decl.index("(")
              j = decl.rindex(")")
              head, params = decl[:i].strip(), decl[i + 1:j].strip()
              toks = head.replace("*", " * ").split()
              name = toks[-1]
              rettoks = [t for t in toks[:-1] if t not in SKIP]
              is_void = rettoks == ["void"]
              args = []
              if params and params != "void":
                  for prm in split_params(params):
                      prm = re.sub(r"\[[^\]]*\]\s*$", "", prm.strip())
                      m = re.search(r"([A-Za-z_]\w*)\s*$", prm)
                      args.append(m.group(1))
              call = "%s(%s)" % (target, ", ".join(args))
              return "%s { %s%s; }" % (decl, "" if is_void else "return ", call), name

          changed = 0
          for dp, _, files in os.walk(root):
              for fn in files:
                  is_cmake = fn == "CMakeLists.txt" or fn.endswith(".cmake")
                  if not (is_cmake or fn.endswith((".c", ".cc", ".cpp", ".h", ".hpp"))):
                      continue
                  path = os.path.join(dp, fn)
                  rel = os.path.relpath(path, root)
                  s = open(path, encoding="utf-8", errors="replace").read()
                  orig = s

                  # --- pass 0 (CMake files only): GNU-only linker flags ---
                  if is_cmake:
                      if "3rdparty" not in rel:
                          s, n = link_re.subn("-Wl,-w", s)
                          if n:
                              changed += n
                              print("  %s: %d x -Bsymbolic -> -Wl,-w" % (rel, n))
                      if s != orig:
                          open(path, "w", encoding="utf-8").write(s)
                      continue

                  # --- pass 1: alias attributes ---
                  if "alias(" in s:
                      out, pos = [], 0
                      for m in alias_re.finditer(s):
                          before = s[pos:m.start()]
                          b = max(before.rfind(";"), before.rfind("}"), before.rfind("{")) + 1
                          keep, chunk = before[:b], before[b:]
                          lines = chunk.split("\n")
                          while lines and (not lines[0].strip() or lines[0].lstrip().startswith(("#", "//"))):
                              keep += lines.pop(0) + "\n"
                          new, name = convert("\n".join(lines), m.group(1))
                          out.append(keep + new)
                          pos = m.end()
                          changed += 1
                          print("  %s: %s -> forwards to %s" % (rel, name, m.group(1)))
                      out.append(s[pos:])
                      s = "".join(out)

                  # --- pass 2: gettid ---
                  m = tid_re.search(s)
                  if m:
                      incs = [i for i in inc_re.finditer(s) if i.end() <= m.start()]
                      at = incs[-1].end() if incs else 0
                      s = s[:at] + "\n" + TID_HELPER + s[at:]
                      s, n = tid_re.subn("mg_darwin_tid()", s)
                      changed += n
                      print("  %s: %d x syscall(gettid) -> mg_darwin_tid()" % (rel, n))

                  if s != orig:
                      open(path, "w", encoding="utf-8").write(s)
          print("patch_mobileglues: %d change(s)" % changed)
          PY1

          python3 - <<'PY2'
          import sys
          p = "Makefile"
          text = open(p).read()
          if "patch_mobileglues.py" in text:
              print("Makefile already calls patch_mobileglues.py, nothing to do")
              sys.exit(0)
          lines = text.split("\n")
          idx = [i for i, l in enumerate(lines) if "--target mobileglues" in l]
          if not idx:
              print("ERROR: no '--target mobileglues' line in Makefile. Lines mentioning mobileglues:")
              for i, l in enumerate(lines):
                  if "mobileglues" in l.lower():
                      print(i + 1, l)
              sys.exit(1)
          s = idx[0]
          while s > 0 and lines[s - 1].rstrip().endswith("\\"):
              s -= 1
          ins = "\tpython3 $(SOURCEDIR)/Natives/patch_mobileglues.py $(SOURCEDIR)/Natives/external/MobileGlues/MobileGlues-cpp"
          lines.insert(s, ins)
          open(p, "w").write("\n".join(lines))
          print("inserted before Makefile line %d:" % (s + 1))
          for l in lines[max(0, s - 2):s + 3]:
              print("   | " + l)
          PY2
          if [ $? -ne 0 ]; then echo "::error::could not patch the Makefile - send me this log"; exit 1; fi

          if git diff --quiet && [ -z "$(git status --porcelain Natives/patch_mobileglues.py)" ]; then echo "No changes (already patched)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile Natives/patch_mobileglues.py
          git commit -q -m "Build: patch MobileGlues for Darwin (alias, gettid, linker flag) before compiling"
          git push origin "HEAD:refs/heads/$BRANCH" && echo "Pushed Darwin patch to $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scan MobileGlues for other Linux-only code
        shell: bash {0}
        run: |
          git submodule update --init Natives/external/MobileGlues 2>&1 | tail -3
          D=Natives/external/MobileGlues/MobileGlues-cpp
          INC="--include=*.c --include=*.cc --include=*.cpp --include=*.h --include=*.hpp"
          {
            echo "== MobileGlues commit: $(git -C Natives/external/MobileGlues rev-parse --short HEAD 2>/dev/null)"
            echo "== Linux-only constructs (3rdparty excluded):"
            grep -rnE '__NR_|syscall *\(|gettid|<linux/|<sys/(prctl|epoll|eventfd|inotify|sysinfo|auxv)|<elf\.h>|<link\.h>|dl_iterate_phdr|memfd_create|sched_(set|get)affinity|pthread_setname_np|prctl *\(|/proc/|__attribute__ *\(\((weak|ifunc)|<malloc\.h>|memalign|<endian\.h>|<byteswap\.h>' $INC "$D" | grep -v '/3rdparty/' | cut -c1-200 | head -120
            echo; echo "== Apple-aware code already present:"
            grep -rnE '__APPLE__|TARGET_OS_' $INC "$D" | grep -v '/3rdparty/' | cut -c1-160 | head -40
            echo; echo "== CMake platform handling:"
            grep -nE 'APPLE|ANDROID|Linux|UNIX|IOS|Darwin|OSX' "$D/CMakeLists.txt" | head -50
          } > scan.txt 2>&1
          cat scan.txt
          { echo '### MobileGlues Linux-only scan'; echo '```'; head -c 9000 scan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mg-darwin-scan
          path: scan.txt
