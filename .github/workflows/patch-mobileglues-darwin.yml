name: Patch MobileGlues for iOS build (alias attributes)

# MobileGlues 2.x uses __attribute__((alias(...))), which Apple's compiler rejects (your build error in framebuffer.cpp).
# This adds Natives/patch_mobileglues.py and makes the Makefile run it right before MobileGlues is compiled.
# It turns every alias into a small forwarding function. Does not touch workflow files. Safe to run twice.
# Run from the Actions tab (workflow_dispatch). Afterwards run "Development build" on that branch.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to patch"
        required: true
        default: "lwjgl-b-mg2"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Add patch script and hook it into the Makefile
        shell: bash {0}
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          mkdir -p Natives
          cat > Natives/patch_mobileglues.py <<'PY1'
          #!/usr/bin/env python3
          """Darwin cannot do __attribute__((alias("x"))). Rewrite every such declaration into a forwarding function.
          Usage: patch_mobileglues.py <MobileGlues-cpp dir>   (idempotent, prints what it changed)"""
          import os, re, sys

          root = sys.argv[1]
          alias_re = re.compile(r'__attribute__\s*\(\(\s*alias\s*\(\s*"(\w+)"\s*\)\s*\)\)\s*;')
          SKIP = {"GLAPI", "GLAPIENTRY", "extern", "static", "inline", "APIENTRY"}

          def split_params(p):
              out, depth, cur = [], 0, ""
              for ch in p:
                  if ch in "([<":
                      depth += 1
                  elif ch in ")]>":
                      depth -= 1
                  if ch == "," and depth == 0:
                      out.append(cur); cur = ""
                  else:
                      cur += ch
              if cur.strip():
                  out.append(cur)
              return out

          def convert(decl, target):
              decl = " ".join(decl.split())
              i = decl.index("(")
              j = decl.rindex(")")
              head, params = decl[:i].strip(), decl[i + 1:j].strip()
              toks = head.replace("*", " * ").split()
              name = toks[-1]
              rettoks = [t for t in toks[:-1] if t not in SKIP]
              is_void = rettoks == ["void"]
              args = []
              if params and params != "void":
                  for prm in split_params(params):
                      prm = re.sub(r"\[[^\]]*\]\s*$", "", prm.strip())
                      m = re.search(r"([A-Za-z_]\w*)\s*$", prm)
                      args.append(m.group(1))
              call = "%s(%s)" % (target, ", ".join(args))
              return "%s { %s%s; }" % (decl, "" if is_void else "return ", call), name

          changed = 0
          for dp, _, files in os.walk(root):
              for fn in files:
                  if not fn.endswith((".c", ".cc", ".cpp", ".h", ".hpp")):
                      continue
                  path = os.path.join(dp, fn)
                  s = open(path, encoding="utf-8", errors="replace").read()
                  if "alias(" not in s:
                      continue
                  out, pos, n = [], 0, 0
                  for m in alias_re.finditer(s):
                      before = s[pos:m.start()]
                      b = max(before.rfind(";"), before.rfind("}"), before.rfind("{")) + 1
                      keep, chunk = before[:b], before[b:]
                      lines = chunk.split("\n")
                      while lines and (not lines[0].strip() or lines[0].lstrip().startswith(("#", "//"))):
                          keep += lines.pop(0) + "\n"
                      new, name = convert("\n".join(lines), m.group(1))
                      out.append(keep + new)
                      pos = m.end()
                      n += 1
                      print("  %s: %s -> forwards to %s" % (os.path.relpath(path, root), name, m.group(1)))
                  if n:
                      out.append(s[pos:])
                      open(path, "w", encoding="utf-8").write("".join(out))
                      changed += n
          print("patch_mobileglues: converted %d alias declaration(s)" % changed)
          PY1

          python3 - <<'PY2'
          import sys
          p = "Makefile"
          text = open(p).read()
          if "patch_mobileglues.py" in text:
              print("Makefile already calls patch_mobileglues.py, nothing to do")
              sys.exit(0)
          lines = text.split("\n")
          idx = [i for i, l in enumerate(lines) if "--target mobileglues" in l]
          if not idx:
              print("ERROR: no '--target mobileglues' line in Makefile. Lines mentioning mobileglues:")
              for i, l in enumerate(lines):
                  if "mobileglues" in l.lower():
                      print(i + 1, l)
              sys.exit(1)
          s = idx[0]
          while s > 0 and lines[s - 1].rstrip().endswith("\\"):
              s -= 1
          ins = "\tpython3 $(SOURCEDIR)/Natives/patch_mobileglues.py $(SOURCEDIR)/Natives/external/MobileGlues/MobileGlues-cpp"
          lines.insert(s, ins)
          open(p, "w").write("\n".join(lines))
          print("inserted before Makefile line %d:" % (s + 1))
          for l in lines[max(0, s - 2):s + 3]:
              print("   | " + l)
          PY2
          if [ $? -ne 0 ]; then echo "::error::could not patch the Makefile - send me this log"; exit 1; fi

          if git diff --quiet && [ -z "$(git status --porcelain Natives/patch_mobileglues.py)" ]; then echo "No changes (already patched)"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile Natives/patch_mobileglues.py
          git commit -q -m "Build: patch MobileGlues alias attributes for Darwin before compiling"
          git push origin "HEAD:refs/heads/$BRANCH" && echo "Pushed Darwin patch to $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
